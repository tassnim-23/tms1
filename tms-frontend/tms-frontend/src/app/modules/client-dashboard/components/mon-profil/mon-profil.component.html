<div class="profil-container">
  <h2>Mon Profil</h2>

  <div *ngIf="success" class="success-message">{{ success }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="loading" class="loading">Chargement...</div>

  <div *ngIf="!loading && profile" class="profile-card">
    <div *ngIf="!editing" class="view-mode">
      <div class="profile-field">
        <label>Raison Sociale:</label>
        <span>{{ profile.raisonSociale }}</span>
      </div>
      <div class="profile-field">
        <label>Email:</label>
        <span>{{ profile.email }}</span>
      </div>
      <div class="profile-field">
        <label>Téléphone:</label>
        <span>{{ profile.telephone }}</span>
      </div>
      <div class="profile-field">
        <label>Matricule Fiscale:</label>
        <span>{{ profile.matriculeFiscale }}</span>
      </div>
      <div class="profile-field">
        <label>Adresse Complère:</label>
        <span>{{ profile.adresseComplete }}</span>
      </div>
      <div class="profile-field">
        <label>Activité:</label>
        <span>{{ profile.activite }}</span>
      </div>
      <button (click)="toggleEditing()" class="btn-edit">✏️ Modifier</button>
    </div>

    <div *ngIf="editing" class="edit-mode">
      <form [formGroup]="profileForm">
        <div class="form-group">
          <label>Raison Sociale:</label>
          <input type="text" formControlName="raisonSociale" class="form-control">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" formControlName="email" class="form-control">
        </div>
        <div class="form-group">
          <label>Téléphone:</label>
          <input type="text" formControlName="telephone" class="form-control">
        </div>
        <div class="form-group">
          <label>Matricule Fiscale:</label>
          <input type="text" formControlName="matriculeFiscale" class="form-control">
        </div>
        <div class="form-group">
          <label>Adresse Complète:</label>
          <textarea formControlName="adresseComplete" class="form-control"></textarea>
        </div>
        <div class="form-group">
          <label>Activité:</label>
          <input type="text" formControlName="activite" class="form-control">
        </div>
        <div class="button-group">
          <button type="button" (click)="saveProfile()" class="btn-save">💾 Enregistrer</button>
          <button type="button" (click)="toggleEditing()" class="btn-cancel">✕ Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
