<!-- ✅ FRONTEND - FacturesComponent HTML Template -->
<!-- Fichier: tms-frontend/tms-frontend/src/app/modules/client-dashboard/components/factures/factures.component.html -->

<div class="factures-container">
  <h1>Mes Factures</h1>
  
  <!-- Loading spinner -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Chargement des factures...</p>
  </div>

  <!-- Factures table -->
  <div *ngIf="!loading" class="factures-content">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Liste des Factures</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div *ngIf="factures.length === 0" class="no-data">
          <p>Aucune facture disponible</p>
        </div>

        <table *ngIf="factures.length > 0" mat-table [dataSource]="factures" class="factures-table">
          
          <!-- Numero Column -->
          <ng-container matColumnDef="numero">
            <th mat-header-cell *matHeaderCellDef>Numéro</th>
            <td mat-cell *matCellDef="let element">{{ element.numero }}</td>
          </ng-container>

          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let element">{{ formatDate(element.date) }}</td>
          </ng-container>

          <!-- Montant Column -->
          <ng-container matColumnDef="montant">
            <th mat-header-cell *matHeaderCellDef>Montant</th>
            <td mat-cell *matCellDef="let element">{{ element.montant | currency:'DZD':'symbol':'1.2-2' }}</td>
          </ng-container>

          <!-- Statut Column -->
          <ng-container matColumnDef="statut">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let element">
              <span class="badge" [class]="'badge-' + element.statut.toLowerCase()">
                {{ element.statut }}
              </span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-raised-button color="primary" 
                      (click)="telechargerFacture(element)"
                      class="action-button">
                <mat-icon>download</mat-icon>
                Télécharger
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
