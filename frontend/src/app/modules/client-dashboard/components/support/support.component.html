<div class="support-container">
  <h2>Support Client</h2>

  <div *ngIf="success" class="success-message">{{ success }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <button *ngIf="!showForm" (click)="showForm = true" class="btn-new">➕ Nouveau Message</button>

  <div *ngIf="showForm" class="form-card">
    <h3>Envoyer un message de support</h3>
    <form [formGroup]="messageForm" (ngSubmit)="envoyerMessage()">
      <div class="form-group">
        <label>Sujet:</label>
        <input type="text" formControlName="sujet" class="form-control" placeholder="Sujet du message">
      </div>
      <div class="form-group">
        <label>Message:</label>
        <textarea formControlName="contenu" class="form-control" placeholder="Détail de votre demande..."></textarea>
      </div>
      <div class="button-group">
        <button type="submit" class="btn-save">✓ Envoyer</button>
        <button type="button" (click)="showForm = false" class="btn-cancel">✕ Annuler</button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="loading">Chargement...</div>

  <div *ngIf="!loading && messages.length > 0" class="messages-list">
    <div *ngFor="let msg of messages" class="message-card">
      <div class="message-header">
        <h4>{{ msg.sujet }}</h4>
        <span [ngClass]="'statut-' + msg.statut.toLowerCase()">{{ msg.statut }}</span>
      </div>
      <p class="message-content">{{ msg.contenu }}</p>
      <div class="message-footer">
        <small>{{ msg.dateEnvoi | date: 'dd/MM/yyyy HH:mm' }}</small>
        <button (click)="supprimerMessage(msg.id)" class="btn-delete">✗ Supprimer</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && messages.length === 0" class="empty-state">
    Aucun message de support
  </div>
</div>
