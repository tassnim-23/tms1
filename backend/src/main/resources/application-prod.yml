spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000

# Security - Production settings
app:
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: true
      max-age: 3600

# Twilio - Production enabled by default
twilio:
  enabled: ${TWILIO_ENABLED:true}

# Email - Production enabled
app:
  email:
    enabled: true

logging:
  level:
    com.grpo.tms: WARN
    org.springframework: WARN
    org.springframework.security: INFO
    org.hibernate: WARN
  file:
    name: /var/log/tms/tms-backend.log
    max-size: 50MB
    max-history: 30
