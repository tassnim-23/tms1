spring:
  application:
    name: tms-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
    open-in-view: false

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Tunis

  cache:
    type: simple

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@localhost}
    password: ${MAIL_PASSWORD:dev-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  task:
    scheduling:
      pool:
        size: 5
    execution:
      pool:
        core-size: 5

  thymeleaf:
    check-template-location: false

  main:
    allow-bean-definition-overriding: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:tms-grpo-secret-key-minimum-32-characters-secure-ok}
  expiration: ${JWT_EXPIRATION:604800000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

app:
  email:
    from: ${MAIL_FROM:TMS GRPO Consulting <noreply@grpo-consulting.com>}
    enabled: ${MAIL_ENABLED:true}
    username: ${APP_EMAIL_USERNAME:admin@grpo-consulting.com}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: '*'
      allow-credentials: true
      max-age: 3600

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:dev-sid}
  auth:
    token: ${TWILIO_AUTH_TOKEN:dev-token}
  phone:
    number: ${TWILIO_PHONE_NUMBER:+21600000000}
  enabled: ${TWILIO_ENABLED:false}

security:
  max-failed-attempts: ${SECURITY_MAX_FAILED_ATTEMPTS:5}
  block-duration-minutes: ${SECURITY_BLOCK_DURATION:15}
  failed-attempts-window-minutes: ${SECURITY_WINDOW_MINUTES:30}

logging:
  level:
    com.grpo.tms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/tms-backend.log
    max-size: 10MB
    max-history: 7